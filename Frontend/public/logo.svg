<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="h-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="h-border-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Blue Leaf -->
    <linearGradient id="h-blue-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Green Check Leaf -->
    <linearGradient id="h-green-leaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Gold Ribbon -->
    <linearGradient id="h-gold-ribbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- EMBLEM ICON (Left side, scaled precisely to 46x46 px) -->
  <g transform="translate(5, 5) scale(0.08984)">
    <!-- Base Rounded Squircle -->
    <rect x="20" y="20" width="472" height="472" rx="112" ry="112" fill="url(#h-bg-dark)" />
    <rect x="20" y="20" width="472" height="472" rx="112" ry="112" fill="none" stroke="url(#h-border-dark)" stroke-width="8" />

    <!-- Ambient Glow -->
    <circle cx="160" cy="150" r="160" fill="#2563eb" opacity="0.35" />
    <circle cx="360" cy="330" r="150" fill="#10b981" opacity="0.3" />

    <!-- Book Back Cover -->
    <path d="M256 122 C210 112 144 126 98 138 C86 142 78 153 78 166 L78 356 C78 372 92 384 108 381 C152 372 216 360 256 376 C296 360 360 372 404 381 C420 384 434 372 434 356 L434 166 C434 153 426 142 414 138 C368 126 302 112 256 122 Z" 
          fill="#0b1120" opacity="0.85" />

    <!-- Left Page -->
    <path d="M252 134 C212 124 154 136 112 148 C100 152 92 163 92 176 L92 352 C92 366 104 378 118 375 C158 366 214 355 252 368 Z" 
          fill="url(#h-blue-leaf)" />
    
    <!-- Ledger Lines -->
    <rect x="126" y="194" width="94" height="16" rx="8" fill="#ffffff" />
    <rect x="126" y="230" width="76" height="15" rx="7.5" fill="#bae6fd" />
    <rect x="126" y="266" width="86" height="15" rx="7.5" fill="#bae6fd" />
    <rect x="126" y="302" width="60" height="15" rx="7.5" fill="#7dd3fc" />

    <!-- Right Page depth -->
    <path d="M260 134 C300 124 358 136 400 148 C412 152 420 163 420 176 L420 352 C420 366 408 378 394 375 C354 366 298 355 260 368 Z" 
          fill="#064e3b" opacity="0.45" />

    <!-- Center Spine -->
    <path d="M256 126 L256 380" stroke="#090d16" stroke-width="12" stroke-linecap="round" />
    <path d="M256 130 L256 376" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />

    <!-- Ribbon -->
    <path d="M242 128 L270 128 L270 228 L256 212 L242 228 Z" fill="url(#h-gold-ribbon)" />

    <!-- Checkmark -->
    <path d="M228 296 C218 284 219 266 232 254 C244 243 262 245 273 257 L298 286 L376 182 C386 168 406 166 418 176 C431 187 433 207 421 221 L320 354 C313 363 302 368 290 367 C279 366 269 359 263 349 L228 296 Z"
          fill="url(#h-green-leaf)" />
    <circle cx="414" cy="184" r="8" fill="#ffffff" />
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(60, 0)">
    <!-- Brand Title -->
    <text x="0" y="31" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.3px">
      <tspan fill="#ffffff">Hisab</tspan><tspan fill="#38bdf8">Kitab</tspan>
    </text>

    <!-- Tagline -->
    <text x="1" y="46" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.8px" fill="#94a3b8">
      DIGITAL KHATA &amp; LEDGER
    </text>
  </g>
</svg>
